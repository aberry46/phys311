<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHYS 311 | Lab 9</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>PHYS 311: Multi-Body Simulation</h1>
  <div class="controls">
    <label>Scene <select id="scene"><option value="billiards">Billiards</option><option value="jitter">Jitter Guard Test</option><option value="orbits">N-Body Gravity</option><option value="springs">Spring Network</option></select></label>
    <label>Integrator <select id="integrator"><option value="verlet">Velocity Verlet</option><option value="euler">Euler-Cromer</option></select></label>
    <label>Restitution <input id="restitution" type="range" min="0" max="1" step="0.05" value="1"><span id="restitution-label"></span></label>
    <label>Ball count <input id="count" type="range" min="20" max="200" step="10" value="20"><span id="count-label"></span></label>
    <label><input id="guard" type="checkbox" checked> Jitter guard</label>
    <button id="pause">Pause</button><button id="reset">Reset</button><button id="report">Log measurements</button>
  </div>
  <div class="stage"><canvas id="simulation" width="1000" height="630"></canvas><pre id="hud"></pre></div>
  <p id="status">Starting</p>
  <script type="module" src="./main.js"></script>
</body>
</html>
